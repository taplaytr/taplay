<script type="module">

onAuthStateChanged(auth,async u=>{
if(!u){ROLE="";TM.hide();$("login").hidden=false;$("app").hidden=true;return}

msg("");TM.show();$("login").hidden=true;$("app").hidden=false;

$("usr").hidden=true;$("ls").hidden=false;$("q").hidden=false;load()});
function genPw(){const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",x=new Uint32Array(16);crypto.getRandomValues(x);let s="";for(const v of x)s+=a[v%a.length];return s}
const ROLES={yonetici:"Yönetici (her şey)",editor:"Editör (ekler, düzenler, silemez)",izleyici:"İzleyici (sadece görür)"};
let ap2=null;
function mkEl(t,css,txt){const x=document.createElement(t);if(css)x.style.cssText=css;if(txt!=null)x.textContent=txt;return x}
const SELCSS="width:100%;background:#0e0e10;border:1px solid #3a3320;color:#fff;border-radius:16px;padding:14px;margin:0 0 16px;font-size:16px";
async function usersView(){
const v=$("usr");v.hidden=false;["ls","q","ed"].forEach(i=>$(i).hidden=true);v.innerHTML="";msg("");
v.appendChild(mkEl("h1",null,"Panel kullanıcıları"));
const em=mkEl("input");em.type="email";em.id="u_em";em.placeholder="kisi@ornek.com";
const rl=mkEl("select",SELCSS);rl.id="u_rl";Object.keys(ROLES).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=ROLES[k];rl.appendChild(o)});rl.value="editor";

const b1=mkEl("button",null,"Kullanıcı ekle");b1.className="b";b1.onclick=addUser;

const b3=mkEl("button",null,"Geri");b3.className="b b2";b3.onclick=()=>{v.hidden=true;$("ls").hidden=false;$("q").hidden=false};
const res=mkEl("div","color:#f3d98b;font-size:14px;margin:10px 0;word-break:break-all");res.id="u_res";
const lst=mkEl("div");lst.id="u_ls";
[mkEl("label",null,"E-posta"),em,mkEl("label",null,"Yetki"),rl,mkEl("label",null,"Geçici şifre (en az 12 karakter, kişiye ilet)"),pw,b1,b2,b3,res,lst].forEach(x=>v.appendChild(x));
await usersList()}
async function addUser(){
const em=$("u_em").value.trim().toLowerCase(),rl=$("u_rl").value,pw=$("u_pw").value,res=$("u_res");res.textContent="";
if(!/^\S+@\S+\.\S+$/.test(em)){msg("Geçerli bir e-posta yaz");return}
if(pw.length<12){msg("Şifre en az 12 karakter olmalı");return}
let made=false;
try{if(!ap2)ap2=initializeApp(CFG,"sec");const a2=getAuth(ap2);await createUserWithEmailAndPassword(a2,em,pw);await signOut(a2);made=true}
catch(x){if(x.code!=="auth/email-already-in-use"){msg("Hesap açılamadı: "+(x.code||x.message));return}}
try{await setDoc(doc(db,"users",em),{email:em,role:rl,olusturma:serverTimestamp()})}catch(x){msg("Yetki kaydedilemedi: "+(x.code||x.message));return}
msg(made?"Hesap oluşturuldu ✓":"Bu e-posta zaten kayıtlıydı, sadece yetki verildi ✓");
if(made){res.textContent="Giriş: "+em+"  Şifre: "+pw+"  (Bu şifre bir daha gösterilmez, kişiye güvenli ilet)";const c=mkEl("button",null,"Şifreyi kopyala");c.className="b b2";c.onclick=()=>navigator.clipboard.writeText(pw).then(()=>msg("Şifre kopyalandı"));res.appendChild(document.createElement("br"));res.appendChild(c)}
$("u_em").value="";$("u_pw").value=genPw();usersList()}
async function usersList(){
const lst=$("u_ls");lst.innerHTML="";
try{const s=await getDocs(collection(db,"users"));
s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id.localeCompare(b.id)).forEach(u=>{
const d=mkEl("div");d.className="it";const r=mkEl("div");r.className="row";r.appendChild(mkEl("b",null,u.email||u.id));
const sel=mkEl("select","background:#0e0e10;color:#fff;border:1px solid #3a3320;border-radius:12px;padding:8px");Object.keys(ROLES).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;sel.appendChild(o)});sel.value=u.role||"izleyici";
sel.onchange=async()=>{try{await updateDoc(doc(db,"users",u.id),{role:sel.value});msg("Yetki güncellendi ✓")}catch(x){msg("Güncellenemedi: "+(x.code||x.message))}};
r.appendChild(sel);d.appendChild(r);
const rb=mkEl("button",null,"Şifre e-postası gönder");rb.className="b b2";rb.onclick=async()=>{try{await sendPasswordResetEmail(auth,u.id);msg("Şifre belirleme e-postası gönderildi: "+u.id)}catch(x){msg("Gönderilemedi: "+(x.code||x.message))}};
const del=mkEl("button",null,"Yetkiyi kaldır");del.className="b bd";del.onclick=async()=>{if(u.id===(auth.currentUser.email||"").toLowerCase()){msg("Kendi yetkini kaldıramazsın");return}if(confirm(u.id+" panele girişten çıkarılsın mı?")){await deleteDoc(doc(db,"users",u.id));usersList()}};
d.appendChild(rb);d.appendChild(del);lst.appendChild(d)})
}catch(x){lst.textContent="Liste okunamadı: "+(x.code||x.message)}}
$("us").onclick=usersView;
async function load(){try{const s=await getDocs(collection(db,"cards"));ALL=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.etiket||a.isletme||"").localeCompare(b.etiket||b.isletme||"","tr"));draw()}catch(e){msg("Liste okunamadı: kurallarda e-postanı kontrol et")}}
let VIEW=null,SHOWN=15,MERGE=false,UMODE=false;const SEL=new Set(),USEL=new Set();
const gkey=c=>String(c.grup||"").trim()||String(c.isletme||"").trim()||String(c.etiket||"").split(" - ")[0].trim()||"(adsız)";
const norm=t=>t.toLocaleLowerCase("tr");
function rowEl(c){const d=document.createElement("div");d.className="it";d.style.cssText="padding:10px 12px;margin-bottom:7px;cursor:pointer"+(c.aktif===false?";opacity:.5":"");
d.innerHTML='<div class="row"><b></b><small></small></div><small></small>';
d.children[0].children[0].textContent=c.etiket||c.isletme||"(adsız)";d.children[0].children[1].textContent=(c.okutma||0)+" okutma";d.children[1].textContent="Kod: "+c.id;if(UMODE&&VIEW){if(c.grup){const cb=document.createElement("input");cb.type="checkbox";cb.style.cssText="width:22px;height:22px;margin:0 0 0 8px";cb.checked=USEL.has(c.id);cb.onclick=ev=>{ev.stopPropagation();cb.checked?USEL.add(c.id):USEL.delete(c.id)};d.children[0].appendChild(cb);d.onclick=()=>{cb.checked=!cb.checked;cb.checked?USEL.add(c.id):USEL.delete(c.id)}}else d.onclick=()=>edit(c.id,c)}else d.onclick=()=>edit(c.id,c);return d}
function groupsOf(){const G=new Map();ALL.forEach(c=>{const t=gkey(c),k=norm(t);if(!G.has(k))G.set(k,{k:k,t:t,items:[]});G.get(k).items.push(c)});return G}
function draw(){
const ls=$("ls");ls.innerHTML="";const q=$("q").value.toLowerCase().trim();
const match=c=>!q||((c.etiket||"")+" "+(c.isletme||"")+" "+(c.grup||"")+" "+(c.slogan||"")).toLowerCase().includes(q)||c.id.includes(q);

if(VIEW&&G.has(VIEW)){firmView(G.get(VIEW),match);return}

if(q){const m=ALL.filter(match);ls.appendChild(mkEl("div","color:#8d877a;font-size:13px;margin:0 0 10px",m.length+" sonuç"));m.slice(0,30).forEach(c=>ls.appendChild(rowEl(c)));if(m.length>30)ls.appendChild(mkEl("div","color:#8d877a;font-size:13px","İlk 30 sonuç gösteriliyor, aramayı daraltın"));return}
const groups=[...G.values()].sort((a,b)=>a.t.localeCompare(b.t,"tr"));

if(canEdit()){const mb=mkEl("button",null,MERGE?"İptal":"Firmaları birleştir");mb.className="b b2";mb.style.cssText="margin:0;padding:8px 12px;font-size:13px";mb.onclick=()=>{MERGE=!MERGE;SEL.clear();draw()};top.appendChild(mb)}

if(MERGE){const bar=mkEl("div","margin-bottom:12px");const nm=mkEl("input");nm.type="text";nm.placeholder="Birleşik firma adı (örn. Esteworld)";nm.id="mg_nm";const go=mkEl("button",null,"Seçilenleri birleştir");go.className="b";go.onclick=mergeGo;bar.appendChild(nm);bar.appendChild(go);ls.appendChild(bar)}
groups.forEach(g=>{
const sum=g.items.reduce((s,c)=>s+(c.okutma||0),0),box=mkEl("div");box.className="it";box.style.cssText="padding:12px 14px;margin-bottom:8px;cursor:pointer";
const row=mkEl("div");row.className="row";const left=mkEl("div","min-width:0");left.appendChild(mkEl("b",null,g.t));left.appendChild(mkEl("small","display:block;margin-top:2px",g.items.length+" kart · "+sum+" okutma"));row.appendChild(left);
if(MERGE){const cb=mkEl("input");cb.type="checkbox";cb.style.cssText="width:22px;height:22px;margin:0";cb.checked=SEL.has(g.k);cb.onclick=ev=>{ev.stopPropagation();cb.checked?SEL.add(g.k):SEL.delete(g.k)};row.appendChild(cb);box.onclick=()=>{cb.checked=!cb.checked;cb.checked?SEL.add(g.k):SEL.delete(g.k)}}
else{row.appendChild(mkEl("span","color:#d4af37;font-size:22px;flex:none","›"));box.onclick=()=>{if(g.items.length===1){edit(g.items[0].id,g.items[0]);return}VIEW=g.k;SHOWN=15;$("q").value="";draw();window.scrollTo(0,0)}}

function firmView(g,match){
const ls=$("ls"),sum=g.items.reduce((s,c)=>s+(c.okutma||0),0);
const back=mkEl("button",null,"← Tüm firmalar");back.className="b b2";back.onclick=()=>{VIEW=null;UMODE=false;USEL.clear();$("q").value="";draw()};ls.appendChild(back);

if(UMODE){const go=mkEl("button",null,"Seçilenleri çıkar");go.className="b";go.onclick=()=>{if(!USEL.size){msg("Önce çıkaracağın kartları işaretle");return}if(confirm(USEL.size+" kart firmadan çıkarılsın mı?"))ungroup([...USEL])};bar.appendChild(go)}

async function ungroup(ids){try{let n=0;for(const id of ids){await updateDoc(doc(db,"cards",id),{grup:""});n++;msg("Çıkarılıyor "+n+"/"+ids.length+"...")}USEL.clear();UMODE=false;msg("Firmadan çıkarıldı ✓");await load()}catch(x){msg("Çıkarılamadı: "+(x.code||x.message))}}

function showQR(txt){const e=$("ed");let b=document.getElementById("qrb");if(b)b.remove();b=document.createElement("div");b.id="qrb";b.style.cssText="text-align:center;margin-top:14px";e.appendChild(b);
if(typeof QRCode==="undefined"){b.textContent="QR kütüphanesi yüklenemedi, interneti kontrol edip tekrar deneyin";return}
const t=document.createElement("div");t.style.display="none";b.appendChild(t);
new QRCode(t,{text:txt,width:300,height:300,correctLevel:QRCode.CorrectLevel.M});
setTimeout(()=>{const s=t.querySelector("canvas");if(!s){b.textContent="QR oluşturulamadı";return}const c=document.createElement("canvas");c.width=c.height=380;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,380,380);x.drawImage(s,40,40,300,300);c.style.cssText="max-width:100%;border-radius:8px";b.insertBefore(c,t);
const a=document.createElement("a");a.className="b";a.style.cssText="display:inline-block;text-decoration:none;margin-top:10px";a.textContent="QR'ı indir (PNG)";a.href=c.toDataURL("image/png");a.download=(txt.split("c=")[1]||"kod")+"-qr.png";b.appendChild(a);const p=document.createElement("div");p.style.cssText="color:#8d877a;font-size:12px;margin-top:8px";p.textContent="İndirme açılmazsa görsele uzun basıp Fotoğraflara ekleyin. QR şu adrese gider: "+txt;b.appendChild(p);b.scrollIntoView()},150)}
function logoData(f,sizes,maxLen){sizes=sizes||[360,280,200,140];maxLen=maxLen||150000;return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);for(const mx of sizes){const r=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);let d=c.toDataURL("image/webp",0.85);if(d.indexOf("data:image/webp")!==0)d=c.toDataURL("image/png");if(d.length<=maxLen){res(d);return}}rej(new Error("Görsel çok büyük, daha küçük ya da sade bir görsel seçin"))};im.onerror=()=>rej(new Error("Görsel okunamadı (PNG, JPG ya da WebP seçin)"));im.src=u})}
async function logoWork(c,o){const lf=$("f_logo"),rm=$("f_logorm"),f=lf&&lf.files&&lf.files[0];if(f){msg("Logo hazırlanıyor...");o.logo=await logoData(f)}else if(rm&&rm.checked)o.logo=""}

async function pdfWork(id,c,o){
const inp=$("f_pdf"),rm=$("f_pdfrm"),old=(c&&c.pdfn)||0,f=inp&&inp.files&&inp.files[0];
if(f){
if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name))throw new Error("Sadece PDF dosyası yüklenebilir");
if(f.size>4*1024*1024)throw new Error("PDF 4 MB'tan büyük, küçültüp tekrar deneyin");
const buf=new Uint8Array(await f.arrayBuffer()),SZ=900000,n=Math.ceil(buf.length/SZ);
for(let i=0;i<n;i++){msg("PDF yükleniyor "+(i+1)+"/"+n+"...");await setDoc(doc(db,"files",id+"_"+i),{b:Bytes.fromUint8Array(buf.slice(i*SZ,(i+1)*SZ)),n:i})}
for(let i=n;i<old;i++)await deleteDoc(doc(db,"files",id+"_"+i));
o.pdfn=n;o.pdfname=f.name;
}else if(rm&&rm.checked&&old){
for(let i=0;i<old;i++)await deleteDoc(doc(db,"files",id+"_"+i));
o.pdfn=0;o.pdfname="";
}}
