<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0c1d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>TapGame — Masada oyun zamanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0d0c1d;--bg2:#17162f;--line:#2c2a52;--tx:#f4f3ff;--mu:#a3a1c9;--ac:#8b6cff;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--c1:#7c5cff;--c2:#c026d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Outfit',system-ui,-apple-system,sans-serif;min-height:100%;overscroll-behavior:none}
body{background:radial-gradient(800px 500px at 10% -10%,#3b2a8a66,transparent 60%),radial-gradient(700px 500px at 110% 10%,#c026d333,transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.disp{font-family:'Fredoka','Outfit',sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(14px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:25px;font-weight:700;letter-spacing:-.5px}.logo span{color:var(--ac)}
.tr{display:flex;gap:8px;align-items:center}
.badge{background:#ffffff14;border:1px solid #ffffff1f;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px}
.ib{width:42px;height:42px;border-radius:13px;background:#ffffff12;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.ib:active{transform:scale(.94)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:24px 20px 20px;background:linear-gradient(135deg,#6d4aff,#c026d3 60%,#f43f5e);box-shadow:0 24px 50px -24px #a855f7;margin-bottom:22px}
.hero h1{margin:6px 0 8px;font-size:31px;line-height:1.05;position:relative}
.hk{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.1em;position:relative}
.hero p{margin:0 0 16px;opacity:.92;position:relative}
.hero .btn{background:#fff;color:#2a1065;box-shadow:0 8px 20px -8px #0006;position:relative}
.hero:after{content:'🎲';position:absolute;right:-14px;top:-10px;font-size:120px;opacity:.2;transform:rotate(18deg)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 15px;border-radius:999px;background:#ffffff0f;border:1px solid #ffffff14;white-space:nowrap;font-weight:600;font-size:14px;color:var(--mu)}
.chip.on{background:var(--tx);color:#111;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{position:relative;text-align:left;border-radius:22px;padding:14px;min-height:156px;background:linear-gradient(150deg,var(--c1),var(--c2));display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 28px -16px var(--c2);transition:transform .15s;animation:cardin .4s both}
.gc:active{transform:scale(.97)}
.gc:before{content:'';position:absolute;inset:0;background:radial-gradient(130px 100px at 100% 0,#ffffff45,transparent 70%);pointer-events:none}
.ge{font-size:40px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 4px 8px #0003)}
.gn{font-size:19px;font-weight:700;margin-top:12px;position:relative}
.gd{font-size:12.5px;opacity:.9;line-height:1.3;margin-top:3px;position:relative}
.gp{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;background:#00000033;padding:4px 8px;border-radius:999px}
.foot{text-align:center;color:var(--mu);font-size:12.5px;margin-top:28px;line-height:1.6}
/* game view */
body.ingame{overflow:hidden}
.gv{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;animation:slidein .22s ease}
.gv:before{content:'';position:absolute;inset:0;background:radial-gradient(600px 320px at 50% -120px,color-mix(in srgb,var(--c1) 40%,transparent),transparent 70%);pointer-events:none}
.gbar{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 8px;max-width:560px;width:100%;margin:0 auto}
.gt{flex:1;text-align:center;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbody{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(22px + var(--safe-b));max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 8px 20px -10px var(--c2);transition:transform .1s;text-align:center}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#ffffff14;box-shadow:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.big{width:100%;padding:17px;font-size:18px;border-radius:16px}
.btn.ok{background:#16a34a;box-shadow:none}.btn.bad{background:#dc2626;box-shadow:none}.btn.warn{background:#f59e0b;color:#1a1200;box-shadow:none}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;width:100%}.row>.btn{flex:1}
.stats{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap;align-items:center}
.stat{background:#ffffff0f;border:1px solid #ffffff12;border-radius:12px;padding:7px 12px;font-size:13px;color:var(--mu)}
.stat b{color:var(--tx);font-size:16px;margin-left:4px}
.seg{display:flex;background:#ffffff0f;border-radius:13px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center}
.seg button{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:#fff;color:#111}
.lbl{font-size:13px;color:var(--mu);font-weight:600;text-align:center;margin-top:4px}
.muted{color:var(--mu);text-align:center;font-size:14px;line-height:1.5;margin:0}
.card{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center}
.inp{width:100%;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:12px;padding:12px;color:var(--tx);font:inherit;outline:none}
.inp:focus{border-color:var(--c1)}
.setup{width:100%;display:flex;flex-direction:column;gap:12px}
.setup h3{margin:4px 0 0;font-size:20px;text-align:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}.stepper b{font-size:36px;min-width:56px;text-align:center}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbar{width:100%;height:10px;background:#ffffff14;border-radius:99px;overflow:hidden;flex:none}.tbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .25s linear}
.bigtime{font-family:Fredoka,sans-serif;font-size:46px;font-weight:700;line-height:1}
.bigtime.low{color:#f87171;animation:pulse .5s infinite}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:#05040fcc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .18s}
.ov.out{opacity:0;transition:opacity .18s}
.mbox{width:100%;max-width:400px;max-height:86vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:26px;padding:22px;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.mbox h2{margin:0 0 10px;font-size:25px;text-align:center}
.mbody{color:#d6d4f0;line-height:1.55;font-size:15px}
.mbody ul{padding-left:20px;margin:8px 0}
.mact{display:flex;gap:10px;margin-top:18px}.mact .btn{flex:1}
.over-e{font-size:60px;text-align:center;line-height:1.1}.over-s{font-size:52px;text-align:center;font-weight:700;font-family:Fredoka,sans-serif}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:999px;font-weight:700;z-index:60;animation:up .2s;box-shadow:0 10px 30px #0006;white-space:nowrap}
.toast.out{opacity:0;transition:.3s}
/* 2048 */
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:#ffffff10;border-radius:18px;width:100%;max-width:400px;aspect-ratio:1;touch-action:none}
.t2{border-radius:12px;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(20px,7vw,34px);background:#ffffff0a;color:#fff}
.t2.v2{background:#eee4da;color:#776e65}.t2.v4{background:#ede0c8;color:#776e65}.t2.v8{background:#f2b179}.t2.v16{background:#f59563}.t2.v32{background:#f67c5f}.t2.v64{background:#f65e3b}.t2.v128{background:#edcf72;font-size:clamp(18px,6vw,28px)}.t2.v256{background:#edcc61;font-size:clamp(18px,6vw,28px)}.t2.v512{background:#edc850;font-size:clamp(18px,6vw,28px)}.t2.v1024{background:#edc53f;font-size:clamp(15px,5vw,24px)}.t2.v2048{background:#edc22e;font-size:clamp(15px,5vw,24px);box-shadow:0 0 24px #edc22e}.t2.v4096{background:#a855f7;font-size:clamp(15px,5vw,24px)}
.pop{animation:pop .18s}.merge{animation:mrg .2s}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
.mc{aspect-ratio:1;perspective:600px}
.mi{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.open .mi,.mc.done .mi{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mf.front{background:linear-gradient(135deg,var(--c1),var(--c2));font-size:22px;font-weight:700;color:#ffffff99}
.mf.back{background:#fff;transform:rotateY(180deg);font-size:clamp(24px,8vw,38px)}
.mc.done .mf.back{background:#bbf7d0}
/* canvas */
.cvwrap{border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -20px #000;touch-action:none;line-height:0}
.cv{display:block;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center}
.dpad button{border-radius:14px;background:#ffffff14;font-size:22px}
/* mines */
.mgrid9{display:grid;gap:3px;width:100%;max-width:420px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mn{aspect-ratio:1;border-radius:7px;background:linear-gradient(145deg,#4a4690,#2f2c66);display:grid;place-items:center;font-weight:700;font-size:clamp(13px,4.5vw,20px);font-family:Fredoka,sans-serif;-webkit-touch-callout:none}
.mn.r{background:#ffffff0b}
.mn.n1{color:#60a5fa}.mn.n2{color:#4ade80}.mn.n3{color:#f87171}.mn.n4{color:#c084fc}.mn.n5{color:#fb923c}.mn.n6{color:#2dd4bf}.mn.n7{color:#f472b6}.mn.n8{color:#fff}
.mn.boom{background:#ef4444}
/* sudoku */
.sgrid{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:420px;aspect-ratio:1;border:2px solid #ffffff70;border-radius:10px;overflow:hidden;background:var(--bg2)}
.sc{display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:clamp(16px,5.4vw,24px);font-weight:600;color:#a5b4fc;border-right:1px solid #ffffff1c;border-bottom:1px solid #ffffff1c}
.sc.g{color:var(--tx)}.sc.hl{background:#23224a}.sc.same{background:#3b3580}.sc.sel{background:#6d5ce8;color:#fff}.sc.err{color:#f87171}
.sc.bR{border-right:2px solid #ffffff70}.sc.bB{border-bottom:2px solid #ffffff70}
.npad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:420px}
.npad button{padding:12px 0;border-radius:12px;background:#ffffff12;font-size:22px;font-family:Fredoka,sans-serif;font-weight:600}
.npad button:active{background:#ffffff30}
/* reflex */
.rx{width:100%;flex:1;min-height:340px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;transition:background .08s;touch-action:manipulation}
.rx.idle{background:linear-gradient(145deg,var(--c1),var(--c2))}.rx.wait{background:#b91c1c}.rx.go{background:#16a34a}.rx.early{background:#f59e0b;color:#1a1200}
.rx .big{font-size:48px;font-weight:700;font-family:Fredoka,sans-serif;line-height:1.1}.rx p{margin:10px 0 0;opacity:.9}
/* stroop */
.sword{font-family:Fredoka,sans-serif;font-size:clamp(46px,15vw,72px);font-weight:700;letter-spacing:1px;margin:20px 0;text-shadow:0 2px 0 #0004}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cgrid button{padding:20px 0;border-radius:16px;background:#ffffff12;font-weight:700;font-size:18px;border:2px solid #ffffff18}
.flash-bad{animation:shake .3s}
/* puzzle */
.pz{position:relative;width:100%;max-width:400px;aspect-ratio:1;background:#ffffff10;border-radius:18px}
.pt{position:absolute;left:6px;top:6px;width:calc((100% - 12px)/4);height:calc((100% - 12px)/4);padding:4px;transition:transform .14s ease-out}
.pt>div{width:100%;height:100%;border-radius:12px;background:linear-gradient(145deg,var(--c1),var(--c2));display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(22px,7vw,32px);box-shadow:inset 0 -4px 0 #0003}
.pt.ok>div{box-shadow:inset 0 -4px 0 #0003,0 0 0 2px #ffffffaa}
/* simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;aspect-ratio:1}
.sp{border-radius:28px;opacity:.35;transition:opacity .1s,transform .1s}
.sp.lit{opacity:1;transform:scale(1.03);box-shadow:0 0 40px currentColor}
.sp:nth-child(1){border-top-left-radius:50%}.sp:nth-child(2){border-top-right-radius:50%}.sp:nth-child(3){border-bottom-left-radius:50%}.sp:nth-child(4){border-bottom-right-radius:50%}
/* wordle */
.wb{display:grid;gap:6px;width:100%;max-width:300px}
.wr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wc{aspect-ratio:1;border:2px solid #ffffff26;border-radius:10px;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(20px,7vw,28px)}
.wc.f{border-color:#ffffff80;animation:pop .1s}
.wc.g{background:#22c55e;border-color:#22c55e}.wc.y{background:#eab308;border-color:#eab308}.wc.x{background:#3f3d63;border-color:#3f3d63}
.wc.rev{animation:flip .45s both}
.kb{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.kr{display:flex;gap:4px;justify-content:center}
.kk{flex:1;max-width:40px;height:52px;border-radius:8px;background:#ffffff22;font-weight:700;font-size:15px}
.kk.w{max-width:66px;flex:1.7;font-size:12px}
.kk.g{background:#22c55e}.kk.y{background:#eab308}.kk.x{background:#24223f;color:#6f6d92}
.shake{animation:shake .35s}
/* quiz */
.qq{font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;line-height:1.3;text-align:center;margin:6px 0}
.qopts{display:flex;flex-direction:column;gap:10px;width:100%}
.qopts button{padding:16px;border-radius:16px;background:#ffffff10;border:2px solid #ffffff1a;font-weight:600;font-size:17px;text-align:left;transition:background .15s}
.qopts button.right{background:#16a34a;border-color:#22c55e}.qopts button.wrong{background:#b91c1c;border-color:#ef4444}.qopts button.gone{opacity:.15;pointer-events:none}
/* xox */
.xox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:340px;aspect-ratio:1}
.xc{border-radius:22px;background:#ffffff10;font-family:Fredoka,sans-serif;font-size:clamp(48px,16vw,76px);font-weight:700;display:grid;place-items:center}
.xc.X{color:#f472b6}.xc.O{color:#38bdf8}.xc.win{background:#ffffff35}
.xc span{animation:pop .2s}
.turn{font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;text-align:center}
/* connect 4 */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;background:linear-gradient(160deg,#3b6cff,#1e3a8a);border-radius:20px;width:100%;max-width:420px;box-shadow:0 20px 40px -20px #1e3a8a}
.c4c{aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:inset 0 3px 6px #0008}
.c4c.p1{background:radial-gradient(circle at 35% 35%,#fda4af,#e11d48)}.c4c.p2{background:radial-gradient(circle at 35% 35%,#fef08a,#eab308)}
.c4c.drop{animation:drop .38s cubic-bezier(.55,0,.75,1.3)}
.c4c.win{box-shadow:0 0 0 3px #fff,0 0 18px #fff}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px}
/* zones */
.zones{position:fixed;inset:0;z-index:20;display:grid;background:#000}
.zone{display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Fredoka,sans-serif;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;transition:filter .15s}
.zone .zs{font-size:70px;line-height:1}.zone .zn{font-size:18px;opacity:.9}.zone .zm{font-size:16px;margin-top:6px;min-height:22px}
.zone.flash{filter:brightness(1.6)}.zone.dim{filter:brightness(.4)}
.zcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:#000;color:#fff;padding:14px 24px;border-radius:999px;font-family:Fredoka,sans-serif;font-weight:700;font-size:22px;pointer-events:none;border:3px solid #fff;white-space:nowrap;transition:transform .1s}
.zcenter.go{background:#22c55e;transform:translate(-50%,-50%) scale(1.3)}
.zx{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:4;width:40px;height:40px;border-radius:50%;background:#000c;color:#fff;font-size:18px;border:2px solid #fff6}
/* finger chooser */
.fz{position:relative;width:100%;flex:1;min-height:62vh;border-radius:28px;background:#ffffff08;border:2px dashed #ffffff26;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.fdot{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:9px solid currentColor;box-shadow:0 0 30px currentColor;pointer-events:none;animation:pulse 1s infinite;transition:opacity .3s,transform .3s}
.fdot.lose{opacity:.1;animation:none}.fdot.win{transform:scale(1.5);animation:none;background:currentColor}
.fhint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mu);pointer-events:none;padding:24px;font-size:18px;font-weight:600}
.fring{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:700;font-family:Fredoka,sans-serif;font-size:18px;pointer-events:none}
/* bottle */
.bw{width:min(82vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffffff14,#ffffff04 70%);display:grid;place-items:center;border:2px solid #ffffff18;position:relative;cursor:pointer}
.bottle{width:34%;transition:transform 3.8s cubic-bezier(.1,.65,.1,1);filter:drop-shadow(0 10px 14px #0008)}
.bw .nm{position:absolute;font-weight:700;font-size:13px;background:#ffffff18;padding:3px 8px;border-radius:99px;transform:translate(-50%,-50%);white-space:nowrap}
/* deck */
.deck{width:100%;min-height:300px;border-radius:30px;padding:46px 22px 30px;background:linear-gradient(150deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 22px 50px -22px var(--c2);position:relative;user-select:none}
.deck .dq{font-family:Fredoka,sans-serif;font-size:clamp(23px,6.6vw,31px);font-weight:600;line-height:1.25}
.deck .dk{position:absolute;top:18px;left:20px;font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.1em}
.deck .dn{position:absolute;top:18px;right:20px;font-size:12px;font-weight:700;opacity:.85}
.deck .dw{font-size:15px;opacity:.9;margin-top:14px;font-weight:600}
.in{animation:cardin .32s cubic-bezier(.2,1.2,.4,1)}

reg({ id: '2048', name: '2048', emoji: '🔢', cat: 'solo', players: '1', color: ['#f59e0b', '#ef4444'],
  desc: 'Sayıları birleştir, 2048’e ulaş.',
  howto: 'Ekranı kaydırarak bütün karoları aynı yöne it. Aynı iki sayı çarpışınca birleşip ikiye katlanır. Tahta dolmadan 2048 karosunu yapmaya çalış.',
  mount(root, api) {
    let g, score, won;
    const sc = h('b', {}, '0'), be = h('b', {}, api.best('2048'));
    const board = h('div', { class: 'g2048' });
    root.append(h('div', { class: 'stats' }, h('div', { class: 'stat' }, 'Skor', sc), h('div', { class: 'stat' }, 'Rekor', be), h('button', { class: 'btn sm ghost', onclick: start }, '↻ Yeni')), board,
      h('p', { class: 'muted' }, 'Kaydır ya da klavyede ok tuşlarını kullan'));
    const empty = () => g.reduce((a, v, i) => (v ? a : (a.push(i), a)), []);
    function add() { const e = empty(); if (!e.length) return -1; const i = pick(e); g[i] = Math.random() < .9 ? 2 : 4; return i; }
    function start() { g = Array(16).fill(0); score = 0; won = false; const a = add(), b = add(); draw([a, b], []); }
    function draw(news = [], merged = []) {
      board.innerHTML = '';
      g.forEach((v, i) => board.append(h('div', { class: 't2' + (v ? ' v' + Math.min(v, 4096) : '') + (news.includes(i) ? ' pop' : '') + (merged.includes(i) ? ' merge' : '') }, v || '')));
      sc.textContent = score; be.textContent = api.best('2048', score);
    }
    function canMove() { if (g.includes(0)) return true; for (let i = 0; i < 16; i++) { if (i % 4 < 3 && g[i] === g[i + 1]) return true; if (i < 12 && g[i] === g[i + 4]) return true; } return false; }
    function move(dir) {
      if (!'lrud'.includes(dir) || dir === 'tap') return;
      let moved = false; const merged = [];
      for (let k = 0; k < 4; k++) {
        const idx = [];
        for (let j = 0; j < 4; j++) idx.push(dir === 'l' ? k * 4 + j : dir === 'r' ? k * 4 + 3 - j : dir === 'u' ? j * 4 + k : (3 - j) * 4 + k);
        const vals = idx.map(i => g[i]).filter(Boolean); const out = [];
        for (let j = 0; j < vals.length; j++) {
          if (vals[j] === vals[j + 1]) { out.push(vals[j] * 2); score += vals[j] * 2; merged.push(idx[out.length - 1]); j++; }
          else out.push(vals[j]);
        }
        while (out.length < 4) out.push(0);
        idx.forEach((i, j) => { if (g[i] !== out[j]) moved = true; g[i] = out[j]; });
      }
      if (!moved) return;
      api.sfx(merged.length ? 'flip' : 'move');
      const n = add(); draw([n], merged);
      if (!won && g.includes(2048)) { won = true; api.sfx('win'); api.toast('🎉 2048! Devam edebilirsin'); }
      if (!canMove()) { api.sfx('lose'); api.over({ emoji: '🧱', title: 'Hamle kalmadı', score, text: 'Rekor: ' + api.best('2048'), onRetry: start }); }
    }
    api.swipe(board, move);
    api.keys(e => { const m = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd' }[e.key]; if (m) { e.preventDefault(); move(m); } });
    start();
  } });

reg({ id: 'yilan', name: 'Yılan', emoji: '🐍', cat: 'solo', players: '1', color: ['#22c55e', '#0d9488'],

  mount(root, api) {
    const N = 17; const dpr = window.devicePixelRatio || 1;
    const cv = h('canvas', { class: 'cv' }); const ctx = cv.getContext('2d');
    const sc = h('b', {}, '0'), be = h('b', {}, api.best('yilan'));
    const dirBtn = (d, t, area) => h('button', { style: { gridArea: area }, onclick: () => turn(d) }, t);

      h('div', { class: 'dpad' }, dirBtn('u', '▲', '1/2'), dirBtn('l', '◀', '2/1'), dirBtn('d', '▼', '2/2'), dirBtn('r', '▶', '2/3')));
    const S = Math.floor(Math.min(root.clientWidth - 8 || 340, 420) / N);
    cv.width = S * N * dpr; cv.height = S * N * dpr; cv.style.width = cv.style.height = S * N + 'px'; ctx.scale(dpr, dpr);
    let snake, dir, queue, food, score, alive, acc, msg;
    function place() { do { food = { x: rnd(N), y: rnd(N) }; } while (snake.some(s => s.x === food.x && s.y === food.y)); }
    function reset() { snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = { x: 1, y: 0 }; queue = []; score = 0; sc.textContent = 0; alive = false; acc = 0; msg = 'Başlamak için kaydır'; place(); draw(); }
    function turn(d) {

      const last = queue.length ? queue[queue.length - 1] : dir;
      if ((m.x === -last.x && m.y === -last.y) || (m.x === last.x && m.y === last.y)) { if (!alive) { alive = true; msg = ''; } return; }
      if (queue.length < 3) queue.push(m);
      if (!alive) { alive = true; msg = ''; }
    }
    function step() {
      if (queue.length) dir = queue.shift();
      const hd = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (hd.x < 0 || hd.y < 0 || hd.x >= N || hd.y >= N || snake.slice(0, -1).some(s => s.x === hd.x && s.y === hd.y)) {

    function draw() {
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { ctx.fillStyle = (x + y) % 2 ? '#14532d' : '#166534'; ctx.fillRect(x * S, y * S, S, S); }
      ctx.font = (S * .85) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍎', food.x * S + S / 2, food.y * S + S / 2 + 1);
      snake.forEach((s, i) => { const t = i / snake.length; ctx.fillStyle = `hsl(${85 - t * 40},85%,${62 - t * 18}%)`; rr(s.x * S + 1, s.y * S + 1, S - 2, S - 2, S * .3); });
      const hd = snake[0]; ctx.fillStyle = '#111'; const ex = dir.y ? .25 : .5 + dir.x * .2, ey = dir.x ? .25 : .5 + dir.y * .2;
      ctx.beginPath(); ctx.arc(hd.x * S + S * (dir.y ? .3 : ex), hd.y * S + S * (dir.x ? .3 : ey), S * .1, 0, 7); ctx.arc(hd.x * S + S * (dir.y ? .7 : ex), hd.y * S + S * (dir.x ? .7 : ey), S * .1, 0, 7); ctx.fill();

    api.keys(e => { const m = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd' }[e.key]; if (m) { e.preventDefault(); turn(m); } });

  } });

reg({ id: 'kelimle', name: 'Kelimle', emoji: '🔤', cat: 'solo', players: '1+', color: ['#22c55e', '#eab308'],
  desc: '5 harfli kelimeyi 6 denemede bul.',
  howto: 'Gizli 5 harfli Türkçe kelimeyi 6 denemede bul. Her tahminden sonra harflerin rengi değişir. 🟩 Yeşil: harf doğru yerde. 🟨 Sarı: harf kelimede var ama başka yerde. ⬛ Gri: harf kelimede yok. Masadakilerle birlikte tartışarak da oynayabilirsiniz!',
  mount(root, api) {
    const ROWS = [['E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', 'Ğ', 'Ü'], ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ş', 'İ'], ['⏎', 'Z', 'C', 'V', 'B', 'N', 'M', 'Ö', 'Ç', '⌫']];
    let ans, row, col, grid, done, keyState;
    const board = h('div', { class: 'wb' }); const kb = h('div', { class: 'kb' }); const keys = {};
    const st = h('b', {}, store.get('wstreak', 0));
    root.append(h('div', { class: 'stats' }, h('div', { class: 'stat' }, 'Seri', st), h('button', { class: 'btn sm ghost', onclick: start }, '↻ Yeni kelime')), board, kb);
    ROWS.forEach(r => { const rr = h('div', { class: 'kr' }); r.forEach(k => { const b = h('button', { class: 'kk' + (k.length > 1 || k === '⏎' || k === '⌫' ? ' w' : ''), onclick: () => press(k) }, k === '⏎' ? 'GİR' : k); keys[k] = b; rr.append(b); }); kb.append(rr); });
    function start() {
      ans = Array.from(pick(WORDS)); row = 0; col = 0; done = false; keyState = {}; grid = [...Array(6)].map(() => Array(5).fill(''));
      board.innerHTML = ''; for (let r = 0; r < 6; r++) { const rr = h('div', { class: 'wr' }); for (let c = 0; c < 5; c++) rr.append(h('div', { class: 'wc' })); board.append(rr); }
      Object.values(keys).forEach(k => k.classList.remove('g', 'y', 'x'));
    }
    const cell = (r, c) => board.children[r].children[c];
    function press(k) {
      if (done) return;
      if (k === '⌫') { if (col > 0) { col--; grid[row][col] = ''; cell(row, col).textContent = ''; cell(row, col).classList.remove('f'); } return; }

      const thisRow = row; setTimeout(() => { Object.entries(keyState).forEach(([l, s]) => { if (keys[l]) { keys[l].classList.remove('g', 'y', 'x'); keys[l].classList.add(s); } }); }, 1100);
      const won = res.every(r => r === 'g'); row++; col = 0;

      }

reg({ id: 'xox', name: 'XOX', emoji: '❌', cat: 'duo', players: '1–2', color: ['#f472b6', '#38bdf8'],

  mount(root, api) {
    const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    let mode = store.get('xox_mode', 'pvp'), b, turn, over, sc = { X: 0, O: 0, D: 0 }, starter = 'X';
    const grid = h('div', { class: 'xox' }); const info = h('div', { class: 'turn' });
    const sX = h('b', {}, 0), sO = h('b', {}, 0), sD = h('b', {}, 0);
    root.append(seg([['pvp', '👥 2 Kişi'], ['easy', '🤖 Kolay'], ['hard', '🤖 Zor']], mode, v => { mode = v; store.set('xox_mode', v); sc = { X: 0, O: 0, D: 0 }; upd(); start(); }),
      h('div', { class: 'stats' }, h('div', { class: 'stat' }, '❌', sX), h('div', { class: 'stat' }, 'Berabere', sD), h('div', { class: 'stat' }, '⭕', sO)), info, grid);
    const win = bb => { for (const l of L) if (bb[l[0]] && bb[l[0]] === bb[l[1]] && bb[l[0]] === bb[l[2]]) return l; return null; };
    function upd() { sX.textContent = sc.X; sO.textContent = sc.O; sD.textContent = sc.D; }
    function start() { b = Array(9).fill(''); turn = starter; over = false; draw(); if (mode !== 'pvp' && turn === 'O') api.after(bot, 450); }
    function draw(wl) {
      grid.innerHTML = '';
      b.forEach((v, i) => grid.append(h('button', { class: 'xc ' + v + (wl && wl.includes(i) ? ' win' : ''), onclick: () => play(i, true) }, v ? h('span', {}, v === 'X' ? '✕' : '○') : '')));
      if (!over) info.innerHTML = '', info.append(mode !== 'pvp' && turn === 'O' ? '🤖 düşünüyor…' : (turn === 'X' ? '✕' : '○') + ' oynuyor');
    }
    function play(i, human) {
      if (over || b[i] || (human && mode !== 'pvp' && turn === 'O')) return;
      b[i] = turn; api.sfx('tap'); const wl = win(b);
      if (wl) { over = true; sc[turn]++; upd(); draw(wl); info.textContent = (turn === 'X' ? '✕' : '○') + ' kazandı! 🎉'; api.sfx(mode !== 'pvp' && turn === 'O' ? 'lose' : 'win'); api.buzz(80); starter = starter === 'X' ? 'O' : 'X'; api.after(start, 1600); return; }
      if (b.every(Boolean)) { over = true; sc.D++; upd(); draw(); info.textContent = 'Berabere 🤝'; starter = starter === 'X' ? 'O' : 'X'; api.after(start, 1400); return; }
      turn = turn === 'X' ? 'O' : 'X'; draw();
      if (mode !== 'pvp' && turn === 'O') api.after(bot, 450);
    }
    function mm(bb, p) { const w = win(bb); if (w) return bb[w[0]] === 'O' ? 10 : -10; if (bb.every(Boolean)) return 0; let best = p === 'O' ? -99 : 99; bb.forEach((v, i) => { if (!v) { bb[i] = p; const s = mm(bb, p === 'O' ? 'X' : 'O'); bb[i] = ''; best = p === 'O' ? Math.max(best, s) : Math.min(best, s); } }); return best; }
    function bot() {
      if (over) return; const free = b.map((v, i) => v ? -1 : i).filter(i => i >= 0); let mv;
      if (mode === 'easy' && Math.random() < .55) mv = pick(free);
      else { let best = -99, opts = []; free.forEach(i => { b[i] = 'O'; const s = mm(b, 'X'); b[i] = ''; if (s > best) { best = s; opts = [i]; } else if (s === best) opts.push(i); }); mv = pick(opts); }
      play(mv, false);
    }
    start();
  } });

reg({ id: 'dortbagla', name: 'Dört Bağla', emoji: '🟡', cat: 'duo', players: '2', color: ['#e11d48', '#eab308'],
  desc: 'Pulları bırak, dördü yan yana diz.',
  howto: 'Sırayla bir sütuna dokunarak pul bırakın. Pul o sütunun en altındaki boş yere düşer. Yatay, dikey ya da çapraz dört pulu yan yana ilk getiren kazanır.',
  mount(root, api) {
    const C = 7, R = 6; let b, turn, over, sc = [0, 0], starter = 1;
    const grid = h('div', { class: 'c4' }); const info = h('div', { class: 'turn' }); const s1 = h('b', {}, 0), s2 = h('b', {}, 0);
    root.append(h('div', { class: 'stats' }, h('div', { class: 'stat' }, h('span', { class: 'dot', style: { background: '#e11d48' } }), 'Kırmızı', s1), h('div', { class: 'stat' }, h('span', { class: 'dot', style: { background: '#eab308' } }), 'Sarı', s2)), info, grid);
    const cells = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const e = h('div', { class: 'c4c' }); e.onclick = () => drop(c); cells.push(e); grid.append(e); }
    function start() { b = Array(R * C).fill(0); turn = starter; over = false; cells.forEach(e => e.className = 'c4c'); say(); }
    function say() { info.innerHTML = ''; info.append(h('span', { class: 'dot', style: { background: turn === 1 ? '#e11d48' : '#eab308' } }), (turn === 1 ? 'Kırmızı' : 'Sarı') + ' oynuyor'); }
    function line(r, c) {
      const p = b[r * C + c];
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const cl = [[r, c]];
        for (const s of [1, -1]) { let rr = r + dr * s, cc = c + dc * s; while (rr >= 0 && rr < R && cc >= 0 && cc < C && b[rr * C + cc] === p) { cl.push([rr, cc]); rr += dr * s; cc += dc * s; } }
        if (cl.length >= 4) return cl;
      } return null;
    }
    function drop(c) {
      if (over) return; let r = R - 1; while (r >= 0 && b[r * C + c]) r--; if (r < 0) { api.buzz(30); return; }
      b[r * C + c] = turn; const e = cells[r * C + c]; e.style.setProperty('--dy', -(r + 1) * 112 + '%'); e.className = 'c4c drop p' + turn; api.sfx('move');
      setTimeout(() => api.sfx('tap'), 300);
      const w = line(r, c);
      if (w) { over = true; sc[turn - 1]++; s1.textContent = sc[0]; s2.textContent = sc[1]; setTimeout(() => w.forEach(([rr, cc]) => cells[rr * C + cc].classList.add('win')), 380); info.textContent = (turn === 1 ? '🔴 Kırmızı' : '🟡 Sarı') + ' kazandı!'; api.sfx('win'); api.buzz(100); starter = 3 - starter; api.after(() => api.over({ emoji: turn === 1 ? '🔴' : '🟡', title: (turn === 1 ? 'Kırmızı' : 'Sarı') + ' kazandı!', score: sc[0] + ' – ' + sc[1], onRetry: start, retryLabel: 'Rövanş' }), 1300); return; }
      if (b.every(Boolean)) { over = true; info.textContent = 'Berabere!'; starter = 3 - starter; api.after(start, 1500); return; }
      turn = 3 - turn; say();
    }
    start();
  } });

    root.innerHTML = '';

      tip ? h('p', { class: 'muted' }, tip) : null,
      h('button', { class: 'btn big', onclick: () => { teams = [i1.value.trim() || 'Takım A', i2.value.trim() || 'Takım B']; store.set(key + '_teams', teams); sc = [0, 0]; turn = 0; api.sfx('ok'); ready(); } }, 'Oyunu başlat')));

  function ready() {
    root.innerHTML = '';
    if (turn >= rounds * 2) {
      const w = sc[0] === sc[1] ? null : sc[0] > sc[1] ? 0 : 1; api.sfx('win');
      if (w != null && mem[w].length) api.award(mem[w], 3, true);
      root.append(board()); api.over({ emoji: w == null ? '🤝' : '🏆', title: w == null ? 'Berabere!' : teams[w] + ' kazandı!', score: sc[0] + ' – ' + sc[1], text: w != null && mem[w].length ? mem[w].join(', ') + ' · ligde +3' : null, onRetry: setup, retryLabel: 'Yeni oyun' }); return;
    }
    const t = turn % 2;
    const teller = mem[t].length ? mem[t][Math.floor(turn / 2) % mem[t].length] : null;
    root.append(board(), h('div', { class: 'card in' }, h('div', { class: 'lbl' }, 'Tur ' + (Math.floor(turn / 2) + 1) + '/' + rounds), h('div', { class: 'rname' }, teams[t]),

      function boom() {

  }
  function refill(st) { for (let r = 0; r < 4; r++) for (let i = 0; i < st.n; i++) st.hands[(st.dealer + 1 + i) % st.n].push(st.deck.pop()); }

    hand.splice(i, 1); const top = st.table[st.table.length - 1]; let ev = null;

      st.cap[seat].push(...st.table, id); st.table = []; st.last = seat;
