<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAPLAY</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111;--muted:#6b7280;--accent:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--text:#f3f4f6;--muted:#9ca3af;--accent:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--text:#f3f4f6;--muted:#9ca3af;--accent:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:20px}
.card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
.bank{color:var(--muted);font-size:14px;margin:0 0 4px}
.brand{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--accent);margin:0 0 14px}
h1{font-size:22px;margin:0 0 22px}
.iban{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.5px;word-break:break-word;background:var(--bg);border-radius:12px;padding:16px 10px;margin-bottom:18px}
button{width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
button.ok{background:#16a34a;color:#fff}
button.sec{margin-top:10px;background:var(--bg);color:var(--text)}
</style>
</head>
<body>
<div class="card">
  <p class="brand">TAPLAY</p>
  <p class="bank" id="bank" hidden></p>
  <h1 id="name"></h1>
  <div class="iban" id="iban"></div>
  <button id="btn">IBAN'ı Kopyala</button>
  <button id="nbtn" class="sec">İsmi Kopyala</button>
</div>
<script>
var q = new URLSearchParams(location.search);
var NAME = q.get("ad") || "";
var BANK = q.get("banka") || "";
var IBAN = q.get("iban") || "";
var raw = IBAN.replace(/\s/g,"").toUpperCase();
if(!raw){document.querySelector(".card").innerHTML='<p class="brand">TAPLAY</p><h1>Bilgi bulunamadı</h1>';throw new Error("no data")}
document.getElementById("name").textContent = NAME;
if(BANK){var b=document.getElementById("bank");b.textContent=BANK;b.hidden=false}
document.getElementById("iban").textContent = raw.replace(/(.{4})/g,"$1 ").trim();
function setup(id,text,label){
  var btn=document.getElementById(id);
  btn.onclick=function(){
    function done(){btn.textContent="Kopyalandı ✓";btn.classList.add("ok");setTimeout(function(){btn.textContent=label;btn.classList.remove("ok")},2000)}
    function fallback(){var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(t)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else{fallback()}
  };
}
setup("btn",raw,"IBAN'ı Kopyala");
setup("nbtn",NAME,"İsmi Kopyala");
</script>
</body>
</html>
